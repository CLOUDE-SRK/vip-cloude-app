<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VIP CLOUDE — Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0A0E16;
    --panel:#121826;
    --panel-2:#161E30;
    --line: rgba(255,255,255,0.08);
    --cyan:#00E5FF;
    --gold:#FFC94A;
    --red:#FF3B5C;
    --ok:#3EE08A;
    --text:#EAF0F8;
    --text-dim:#7E8AA0;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, Roboto, Arial, sans-serif;
    padding:14px;
    padding-bottom:40px;
  }
  h1{
    font-size:18px;
    margin-bottom:4px;
  }
  .subtitle{
    color:var(--text-dim);
    font-size:13px;
    margin-bottom:16px;
  }
  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    color:var(--text-dim);
    cursor:pointer;
  }
  .tab.active{
    background:var(--cyan);
    color:#001018;
    border-color:var(--cyan);
  }
  .refresh-btn{
    width:100%;
    padding:10px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-size:13px;
    margin-bottom:14px;
  }
  .order-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
  }
  .order-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:10px;
  }
  .order-id{
    font-size:11px;
    color:var(--text-dim);
  }
  .order-status{
    font-size:11px;
    font-weight:700;
    padding:3px 8px;
    border-radius:6px;
  }
  .status-pending{ background:rgba(255,201,74,0.16); color:var(--gold); }
  .status-approved{ background:rgba(62,224,138,0.16); color:var(--ok); }
  .status-cancelled{ background:rgba(255,59,92,0.16); color:var(--red); }
  .order-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:4px 0;
    border-bottom:1px solid rgba(255,255,255,0.04);
  }
  .order-row:last-of-type{ border-bottom:none; }
  .order-row .label{ color:var(--text-dim); }
  .order-row .value{ font-weight:600; }
  .order-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .btn{
    flex:1;
    padding:11px 0;
    border-radius:10px;
    border:none;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-approve{ background:var(--ok); color:#04200F; }
  .btn-cancel{ background:var(--red); color:#2A0610; }
  .btn:disabled{ opacity:0.5; }
  .empty-state{
    text-align:center;
    padding:40px 0;
    color:var(--text-dim);
    font-size:14px;
  }
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--panel-2);
    border:1px solid var(--line);
    padding:12px 18px;
    border-radius:10px;
    font-size:13px;
    max-width:90%;
    text-align:center;
    z-index:100;
    display:none;
  }
  .denied{
    text-align:center;
    padding:60px 20px;
    color:var(--text-dim);
  }
</style>
</head>
<body>

<div id="app">
  <h1>🛠 VIP CLOUDE — Admin panel</h1>
  <div class="subtitle">UC buyurtmalarini boshqarish</div>

  <div class="tabs">
    <div class="tab active" id="tab-pending" onclick="switchTab('pending')">Kutilayotgan</div>
    <div class="tab" id="tab-all" onclick="switchTab('all')">Hammasi</div>
  </div>

  <button class="refresh-btn" onclick="loadOrders()">🔄 Yangilash</button>

  <div id="ordersList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); }

const API_URL = 'https://vip-cloude-app.onrender.com';
let currentTab = 'pending';

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 2500);
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tab-pending').classList.toggle('active', tab === 'pending');
  document.getElementById('tab-all').classList.toggle('active', tab === 'all');
  loadOrders();
}

function formatDate(ts){
  const d = new Date(ts * 1000);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${dd}.${mm} ${hh}:${min}`;
}

function statusLabel(status){
  if(status === 'pending') return ['Kutilmoqda', 'status-pending'];
  if(status === 'approved') return ['Tasdiqlangan', 'status-approved'];
  if(status === 'cancelled') return ['Bekor qilingan', 'status-cancelled'];
  return [status, ''];
}

function renderOrders(orders){
  const listEl = document.getElementById('ordersList');

  if(!orders.length){
    listEl.innerHTML = '<div class="empty-state">📭 Buyurtmalar yo\'q</div>';
    return;
  }

  listEl.innerHTML = orders.map(o => {
    const [label, cls] = statusLabel(o.status);
    const name = o.name || 'Foydalanuvchi';
    const actions = o.status === 'pending' ? `
      <div class="order-actions">
        <button class="btn btn-approve" onclick="approveOrder(${o.id}, this)">✅ Tasdiqlash</button>
        <button class="btn btn-cancel" onclick="cancelOrder(${o.id}, this)">❌ Bekor qilish</button>
      </div>
    ` : '';

    return `
      <div class="order-card" id="order-${o.id}">
        <div class="order-top">
          <span class="order-id">Buyurtma #${o.id} · ${formatDate(o.created_at)}</span>
          <span class="order-status ${cls}">${label}</span>
        </div>
        <div class="order-row"><span class="label">Foydalanuvchi</span><span class="value">${name}</span></div>
        <div class="order-row"><span class="label">TG ID</span><span class="value">${o.user_id}</span></div>
        <div class="order-row"><span class="label">PUBG ID</span><span class="value">${o.pubg_id}</span></div>
        <div class="order-row"><span class="label">UC</span><span class="value">${o.uc_amount.toLocaleString('ru-RU')} UC</span></div>
        <div class="order-row"><span class="label">Narxi</span><span class="value">${o.price.toLocaleString('ru-RU')} so'm</span></div>
        ${actions}
      </div>
    `;
  }).join('');
}

async function loadOrders(){
  const listEl = document.getElementById('ordersList');
  listEl.innerHTML = '<div class="empty-state">⏳ Yuklanmoqda...</div>';

  try {
    const res = await fetch(`${API_URL}/admin/orders?status=${currentTab}`, {
      headers: { 'X-Init-Data': tg?.initData || '' }
    });

    if(res.status === 403){
      listEl.innerHTML = '<div class="denied">🚫 Sizga ruxsat yo\'q.<br>Bu panel faqat admin uchun.</div>';
      return;
    }
    if(!res.ok){
      listEl.innerHTML = '<div class="empty-state">⚠ Server xatosi. Qayta urining.</div>';
      return;
    }

    const orders = await res.json();
    renderOrders(orders);
  } catch(e){
    listEl.innerHTML = '<div class="empty-state">⚠ Aloqa yo\'q. Internetni tekshiring.</div>';
  }
}

async function approveOrder(orderId, btnEl){
  const card = document.getElementById(`order-${orderId}`);
  const buttons = card.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);

  try {
    const res = await fetch(`${API_URL}/admin/orders/${orderId}/approve`, {
      method: 'POST',
      headers: { 'X-Init-Data': tg?.initData || '' }
    });
    if(!res.ok){
      showToast('❌ Xatolik: tasdiqlanmadi');
      buttons.forEach(b => b.disabled = false);
      return;
    }
    if(tg) tg.HapticFeedback?.notificationOccurred('success');
    showToast('✅ Tasdiqlandi, foydalanuvchiga xabar yuborildi');
    loadOrders();
  } catch(e){
    showToast('⚠ Aloqa xatosi');
    buttons.forEach(b => b.disabled = false);
  }
}

async function cancelOrder(orderId, btnEl){
  const card = document.getElementById(`order-${orderId}`);
  const buttons = card.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);

  try {
    const res = await fetch(`${API_URL}/admin/orders/${orderId}/cancel`, {
      method: 'POST',
      headers: { 'X-Init-Data': tg?.initData || '' }
    });
    if(!res.ok){
      showToast('❌ Xatolik: bekor qilinmadi');
      buttons.forEach(b => b.disabled = false);
      return;
    }
    if(tg) tg.HapticFeedback?.notificationOccurred('success');
    showToast('✅ Bekor qilindi, pul qaytarildi');
    loadOrders();
  } catch(e){
    showToast('⚠ Aloqa xatosi');
    buttons.forEach(b => b.disabled = false);
  }
}

loadOrders();
</script>
</body>
</html>
